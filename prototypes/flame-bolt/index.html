<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grim Runner · Flame Bolt trial</title>
<style>
* { box-sizing:border-box }
body { margin:0; background:#121923; color:#f4e9dc; font:16px/1.35 system-ui }
iframe { display:block; width:100%; height:100dvh; border:0 }
main { position:fixed; inset:0; display:grid; align-items:safe center; justify-items:center; overflow:auto;
  background:radial-gradient(ellipse at 50% 70%,#342921fa,#101824fa); padding:1rem }
main[hidden] { display:none }
section { width:min(100%,32rem) }
h1 { margin:0; font:600 clamp(28px,6vw,46px) Georgia,serif }
p { margin:.6rem 0 .9rem }
fieldset { border:0; margin:0; padding:0; display:flex; gap:.55rem }
legend { margin-bottom:.35rem }
label,button { border:1px solid #927c6b; border-radius:.5rem; padding:.65rem .9rem; min-height:44px }
label { flex:1; cursor:pointer; background:#232831 }
label:has(:checked) { border-color:#f6ba78; background:#503a2e }
button { margin-top:.8rem; background:#e7bb8c; color:#211b19; font:700 1rem system-ui; cursor:pointer }
button:disabled { opacity:.55 }
</style>
<iframe title="Flame Bolt Crossbow course"></iframe>
<main><section>
<h1>Flame Bolt trial</h1>
<p id="brief">Shoot the first web with Flame or cut it up close. Standard drops the Crawler on impact. Flame needs time to burn. At the second web, aim favors the bat. Slide under the final overhang.</p>
<p id="result" role="status" hidden></p>
<fieldset><legend>Crossbow ammunition</legend>
<label><input name="ammo" type="radio" value="standard" checked> Standard</label>
<label><input name="ammo" type="radio" value="flame"> Flame</label></fieldset>
<button disabled>Loading course…</button>
</section></main>
<script src="course.js"></script>
</html>
