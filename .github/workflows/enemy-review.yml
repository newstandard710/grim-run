name: Enemy touch review
on:
  pull_request:
    paths: ['index.html', 'assets/audio/**', 'tests/phase3/**', 'tests/phase2/pressure.js', '.github/workflows/enemy-review.yml']
jobs:
  enemies:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, webgl]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install chromium
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          RENDERER: ${{ matrix.renderer }}
        run: |
          set -o pipefail
          git fetch --depth 1 origin "$BASE"
          git worktree add --detach "$RUNNER_TEMP/before" "$BASE"
          python -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/before" >/tmp/before.log 2>&1 &
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/after.log 2>&1 &
          python tests/phase3/touch.py "$RENDERER" http://127.0.0.1:8766/ http://127.0.0.1:8765/ | tee enemy-review.txt | grep -E "natural Tundra|steep plant|Imp shot and Cut|two shots|SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enemy-review-${{ matrix.renderer }}
          path: enemy-review.txt
