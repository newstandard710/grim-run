name: Grim Run Chromium Rendering
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  real-browser-sprite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Verify gameplay and obstacle textures in actual Chromium Phaser
        run: node tests/browser-visual-smoke.js
      - name: Verify biome obstacle sprite loading and phone-scale rendering
        run: node tests/browser-obstacle-smoke.js
      - name: Save mobile-size render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grim-run-mobile-renders
          path: test-results/*.png
          if-no-files-found: ignore
