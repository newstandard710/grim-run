name: Grim Run Chromium Rendering
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-checks:
    name: Chromium — ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [movement, powers, world, forest, biomes, cut, vendor-webgl, vendor-canvas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Compare vendor performances and draw times at phone sizes
        if: startsWith(matrix.group, 'vendor-')
        env:
          GROUP: ${{ matrix.group }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          renderer="${GROUP#vendor-}"
          if [ -n "$BASE_REVISION" ]; then
            git fetch --depth 1 origin "$BASE_REVISION"
            baseline="$RUNNER_TEMP/vendor-base"
            git worktree add --detach "$baseline" "$BASE_REVISION"
            node tests/browser-vendor-performances.js "$baseline" baseline "$renderer"
          fi
          node tests/browser-vendor-performances.js . candidate "$renderer"
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.group, 'vendor-')
        with:
          name: ${{ matrix.group }}-performance
          path: test-results/vendor-performance
          if-no-files-found: ignore
      - name: Verify the running grip, Cut contact and phone-size frame timings
        if: matrix.group == 'cut'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_REVISION" ]; then
            git fetch --depth 1 origin "$BASE_REVISION"
            if ! git diff --quiet "$BASE_REVISION" HEAD -- index.html assets/visuals/rising-cut.js assets/visuals/motion-animations.js; then
              baseline="$RUNNER_TEMP/grim-cut-before"
              git worktree add --detach "$baseline" "$BASE_REVISION"
              node tests/browser-tip-down-cut.js "$baseline"
              exit
            fi
          fi
          node tests/browser-tip-down-cut.js
      - name: Check surface placement, contacts, seeded parity and rendering cost
        if: matrix.group == 'cut'
        run: node tests/browser-surface-dressing.js
      - name: Save surface dressing review
        if: always() && matrix.group == 'cut'
        uses: actions/upload-artifact@v4
        with:
          name: surface-dressing-review
          path: test-results/surface/
          if-no-files-found: ignore
      - name: Fetch the previous live Forest renderer
        if: matrix.group == 'forest'
        run: |
          revision=32fd050ea83b3ccfec8f235d3c044ba1f320af20
          git cat-file -e "$revision^{commit}" 2>/dev/null || git fetch --depth 1 origin "$revision"
      - name: Check Forest parallax and compare with the previous live build
        if: ${{ success() && matrix.group == 'forest' }}
        run: node tests/browser-forest-midground.js
      - name: Review grounded scenery, atlas streaming and gameplay parity
        if: ${{ success() && matrix.group == 'biomes' }}
        run: |
          revision=b1930a49c52a8aed796cb3a388165bc5bbb6a898
          git cat-file -e "$revision^{commit}" 2>/dev/null || git fetch --depth 1 origin "$revision"
          node tests/browser-biome-midground.js
      - name: Save biome motion frames and validation metrics
        if: ${{ always() && matrix.group == 'biomes' }}
        uses: actions/upload-artifact@v4
        with:
          name: biome-midground-review
          path: test-results/biome-review
          if-no-files-found: ignore
      - name: Install FFmpeg for the Forest comparison
        if: ${{ !cancelled() && matrix.group == 'forest' && hashFiles('test-results/forest-comparison-frames/127.png') != '' }}
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Encode the completed Forest comparison
        if: ${{ !cancelled() && matrix.group == 'forest' && hashFiles('test-results/forest-comparison-frames/127.png') != '' }}
        run: |
          ffmpeg -hide_banner -loglevel error -framerate 15 -i test-results/forest-comparison-frames/%03d.png \
            -vf "pad=iw:ih+36:0:36:color=0x101922,drawtext=text='PREVIOUS FOREST':x=20:y=9:fontsize=18:fontcolor=white,drawtext=text='ROOTED FOREST':x=w/2+20:y=9:fontsize=18:fontcolor=white" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart test-results/forest-comparison.mp4
      - name: Save Forest pilot review
        if: ${{ always() && matrix.group == 'forest' }}
        uses: actions/upload-artifact@v4
        with:
          name: forest-pilot-review
          path: |
            test-results/forest-comparison.mp4
            test-results/forest-pilot-*.png
            test-results/forest-pilot-metrics.json
          if-no-files-found: ignore
      - name: Review all three fluid cutscenes and exact raised-bow timing
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-cutscene-motion.js
      - name: Save cutscene movement review
        if: ${{ always() && matrix.group == 'movement' }}
        uses: actions/upload-artifact@v4
        with:
          name: cutscene-motion-review
          path: |
            test-results/cutscene-*.png
            test-results/cutscene-motion-*.webm
            test-results/cutscene-realtime.json
          if-no-files-found: ignore
      - name: Verify both vendor holds and safe skip in WebGL and Canvas
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-vendor-hold.js
      - name: Verify grounded Slide paint, fallback, input and recovery
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-ground-slide.js
      - name: Verify proximity plants, named wings, touch time controls and vendor timing
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-gravewing-build.js
      - name: Verify fluid bat poses, stable opacity and shared home/game playback
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-bat-flight.js
      - name: Verify single-sprite Bat and Reaper actor transitions
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-actor-transitions.js
      - name: Verify combat animation, persistent vendors and enlarged pickups
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-combat-polish.js
      - name: Verify fluid movement, blade sweep, phone rendering and CPU frame budget
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-motion-performance.js
      - name: Verify opening load, filled bridges and grounded animation
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: |
          node tests/browser-five-polishes.js
          GRIM_POLISH_CANVAS=1 node tests/browser-five-polishes.js
      - name: Verify sanctuary grounds, vendor introductions and crossbow grip
        if: ${{ !cancelled() && matrix.group == 'movement' }}
        run: node tests/browser-vendor-sanctuaries.js
      - name: Verify rounded ground, collectible sprites, floating ledges, destruction and smoke respawn
        if: ${{ !cancelled() && matrix.group == 'powers' }}
        run: node tests/browser-world-polish.js
      - name: Verify animated powers, combined wings and summit acquisition
        if: ${{ !cancelled() && matrix.group == 'powers' }}
        run: node tests/browser-power-animations.js
      - name: Verify rooted carnivorous plants, curved supports and fog tapered at gaps
        if: ${{ !cancelled() && matrix.group == 'powers' }}
        run: node tests/browser-visual-revision.js
      - name: Verify gameplay and obstacle textures in actual Chromium Phaser
        if: ${{ !cancelled() && matrix.group == 'world' }}
        run: node tests/browser-visual-smoke.js
      - name: Verify biome obstacle sprite loading and phone-scale rendering
        if: ${{ !cancelled() && matrix.group == 'world' }}
        run: node tests/browser-obstacle-smoke.js
      - name: Verify and capture jump-plus-tuck and jump-plus-attack encounters
        if: ${{ !cancelled() && matrix.group == 'world' }}
        run: node tests/browser-air-combos.js
      - name: Verify ground fog and vendor sprites across all biomes
        if: ${{ !cancelled() && matrix.group == 'world' }}
        run: node tests/browser-ground-fog-vendors.js
      - name: Verify abyss fog pixels in WebGL and Canvas
        if: ${{ !cancelled() && matrix.group == 'world' }}
        run: |
          for mode in webgl canvas; do
            GRIM_ABYSS_PIXELS=1 GRIM_ABYSS_RENDERER="$mode" GRIM_ABYSS_OUTPUT="test-results/abyss-$mode" node tests/browser-abyss-walls.js
          done
      - name: Save mobile-size render evidence
        if: ${{ always() && matrix.group != 'forest' }}
        uses: actions/upload-artifact@v4
        with:
          name: grim-run-mobile-renders-${{ matrix.group }}
          path: |
            test-results/*.png
            test-results/gravewing-animation-preview.webm
            test-results/motion-performance.json
            test-results/bat-flight-quality.json
            test-results/motion-animation-preview.webm
            test-results/power-animation-preview.webm
            test-results/combat-animation-preview.webm
            test-results/visual-revision-preview.webm
            test-results/vendor-sanctuary-preview.webm
            test-results/cutscene-motion-*.webm
            test-results/cutscene-realtime.json
            test-results/world-polish-preview.webm
            test-results/beyond-death-preview.webm
          if-no-files-found: ignore
  real-browser-sprite-smoke:
    if: always()
    needs: browser-checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every Chromium group
        env:
          RESULT: ${{ needs.browser-checks.result }}
        run: test "$RESULT" = success
