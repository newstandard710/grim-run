name: Grim Run Chromium Rendering
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/veil-and-reliquary]
  workflow_dispatch:

jobs:
  real-browser-sprite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Verify sanctuary grounds, vendor introductions and crossbow grip
        run: node tests/browser-vendor-sanctuaries.js
      - name: Verify Beyond Death menus, mobile layouts, vendor actions, touch controls and both resurrections
        run: node tests/browser-beyond-death.js
      - name: Verify rounded ground, collectible sprites, floating ledges, destruction and smoke respawn
        run: node tests/browser-world-polish.js
      - name: Verify animated powers, combined wings and summit acquisition
        run: node tests/browser-power-animations.js
      - name: Verify rooted carnivorous plants, curved supports and continuous fog
        run: node tests/browser-visual-revision.js
      - name: Verify gameplay and obstacle textures in actual Chromium Phaser
        run: node tests/browser-visual-smoke.js
      - name: Verify biome obstacle sprite loading and phone-scale rendering
        run: node tests/browser-obstacle-smoke.js
      - name: Verify and capture jump-plus-tuck and jump-plus-attack encounters
        run: node tests/browser-air-combos.js
      - name: Verify ground fog and vendor sprites across all biomes
        run: node tests/browser-ground-fog-vendors.js
      - name: Save mobile-size render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grim-run-mobile-renders
          path: |
            test-results/*.png
            test-results/power-animation-preview.webm
            test-results/visual-revision-preview.webm
            test-results/vendor-sanctuary-preview.webm
            test-results/world-polish-preview.webm
            test-results/beyond-death-preview.webm
          if-no-files-found: ignore
