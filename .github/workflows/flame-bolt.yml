name: Flame Bolt course
on:
  pull_request:
    paths:
      - 'prototypes/flame-bolt/**'
      - '.github/workflows/flame-bolt.yml'
jobs:
  touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, webgl]
        width: [390, 844]
        seed: [7, 33]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install chromium
      - name: Compare matched touch inputs and play both routes at game speed
        env:
          RENDERER: ${{ matrix.renderer }}
          WIDTH: ${{ matrix.width }}
          SEED: ${{ matrix.seed }}
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/flame-http.log" 2>&1 &
          python -u prototypes/flame-bolt/review.py "$RENDERER" --width "$WIDTH" --seed "$SEED"
          python -u prototypes/flame-bolt/review.py "$RENDERER" --width "$WIDTH" --seed "$SEED" --native
