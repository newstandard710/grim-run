name: Obstacle landscape review
on:
  pull_request:
    paths:
      - 'assets/obstacles/**'
      - 'assets/visuals/obstacle*'
      - 'tests/*obstacle*'
      - '.github/workflows/obstacle-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - { renderer: canvas, viewport: 740x360, phase: complete }
          - { renderer: canvas, viewport: 950x430, phase: complete }
          - { renderer: canvas, viewport: 360x740, phase: complete }
          - { renderer: webgl, viewport: 740x360, phase: controls }
          - { renderer: webgl, viewport: 950x430, phase: controls }
          - { renderer: webgl, viewport: 360x740, phase: controls }
          - { renderer: webgl, viewport: 950x430, phase: route33, artifact_suffix: -route33 }
          - { renderer: webgl, viewport: 950x430, phase: route34, artifact_suffix: -route34 }
          - { renderer: webgl, viewport: 740x360, phase: gallery, artifact_suffix: -gallery }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Compare the seeded encounters on the two revisions
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          RENDERER: ${{ matrix.renderer }}
          VIEWPORT: ${{ matrix.viewport }}
          PHASE: ${{ matrix.phase }}
        run: |
          git fetch --depth 1 origin "$BASE_REVISION"
          git worktree add --detach "$RUNNER_TEMP/obstacle-base" "$BASE_REVISION"
          node tests/browser-obstacle-landscapes.js "$RUNNER_TEMP/obstacle-base" "$RENDERER" "$VIEWPORT" "$PHASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obstacle-${{ matrix.renderer }}-${{ matrix.viewport }}${{ matrix.artifact_suffix }}
          path: test-results/obstacle-landscapes/
          if-no-files-found: ignore
