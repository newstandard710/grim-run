name: Foothills Gravebreaker review
on:
  pull_request:
    paths: ['prototypes/gravebreaker/**', '.github/workflows/gravebreaker.yml']
  push:
    branches: [main]
    paths: ['prototypes/gravebreaker/**', '.github/workflows/gravebreaker.yml']
jobs:
  touch:
    if: github.event_name == 'pull_request'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: canvas, args: canvas}
          - {name: native, args: native}
          - {name: webgl-landscape-wall, args: 'webgl 844 wall'}
          - {name: webgl-landscape-crawler, args: 'webgl 844 crawler'}
          - {name: webgl-portrait-wall, args: 'webgl 390 wall'}
          - {name: webgl-portrait-crawler, args: 'webgl 390 crawler'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 imageio-ffmpeg && python -m playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/serve.log 2>&1 &
          if [[ "${{ matrix.name }}" == native ]]; then
            python prototypes/gravebreaker/native.py 2>&1 | tee grave-native.log
          else
            python prototypes/gravebreaker/review.py ${{ matrix.args }} 2>&1 | tee grave-${{ matrix.name }}.log
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gravebreaker-${{ matrix.name }}
          path: |
            grave-review/
            grave-*.log

  public-course:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install chromium
      - name: Play the deployed course in portrait and landscape
        env:
          GAME_URL: https://newstandard710.github.io/grim-run/
        run: python prototypes/gravebreaker/native.py
