name: Foothills Gravebreaker review
on:
  pull_request:
    paths: ['prototypes/gravebreaker/**', '.github/workflows/gravebreaker.yml']
jobs:
  touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, webgl]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 imageio-ffmpeg && python -m playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/serve.log 2>&1 &
          python prototypes/gravebreaker/review.py ${{ matrix.renderer }} 2>&1 | tee grave-${{ matrix.renderer }}.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gravebreaker-${{ matrix.renderer }}
          path: |
            grave-review/
            grave-*.log
