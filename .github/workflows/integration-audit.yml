name: Isolated integration audit
on:
  push:
    branches: [qa/integration-2e5d0ed7]
permissions:
  contents: read
jobs:
  pacing:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        base: ['fa9b464c04d0b516516f231d8a6d2af1ccdaa073', 'e0eb27c3de6e000c59d8b1430e8d5cd20773ef80']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - name: Compare seed 33 on the normal Phaser clock
        env:
          BASE: ${{ matrix.base }}
        run: |
          git fetch --depth 1 origin "$BASE"
          git worktree add --detach "$RUNNER_TEMP/comparison" "$BASE"
          LANDING_BASELINE="$RUNNER_TEMP/comparison" node tests/forest-pacing-repro.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-pacing-${{ matrix.base }}
          path: test-results/pacing/
