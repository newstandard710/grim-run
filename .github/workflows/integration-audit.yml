name: Isolated integration audit
on:
  push:
    branches: [qa/integration-2e5d0ed7]
permissions:
  contents: read
jobs:
  trial:
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, webgl]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - name: Play seed 33 with an isolated browser-response trial
        run: LANDING_BASELINE="$GITHUB_WORKSPACE" TRIAL_RENDERER=${{ matrix.renderer }} node tests/forest-hitch-loader-trial.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-trial-${{ matrix.renderer }}
          path: test-results/loader-trial/
