name: Isolated integration audit
on:
  push:
    branches: [qa/integration-2e5d0ed7]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        args: ['webgl 1280 720', 'canvas 740 360', 'webgl 390 844', 'canvas 740 360 compare']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - if: endsWith(matrix.args, 'compare')
        run: |
          git fetch --depth 1 origin fa9b464c04d0b516516f231d8a6d2af1ccdaa073
          git worktree add --detach "$RUNNER_TEMP/before-foreground" fa9b464c04d0b516516f231d8a6d2af1ccdaa073
          echo "LANDING_BASELINE=$RUNNER_TEMP/before-foreground" >> "$GITHUB_ENV"
      - run: node tests/integration-audit.js ${{ matrix.args }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.args }}
          path: test-results/integration/
