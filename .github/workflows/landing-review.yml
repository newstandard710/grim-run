name: Reaper landing review
on:
  pull_request:
    paths:
      - 'assets/motion/landing/**'
      - 'assets/visuals/landing-motion.js'
      - 'tests/browser-landing.js'
      - '.github/workflows/landing-review.yml'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        renderer: [canvas, webgl]
        viewport: ['844 390', '390 844']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare matched builds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth 1 origin "$BASE"
          git worktree add --detach "$RUNNER_TEMP/landing-before" "$BASE"
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Compare seeded terrain, input ticks, drawings and warm frame times
        env:
          LANDING_BASELINE: ${{ runner.temp }}/landing-before
        run: node tests/browser-landing.js ${{ matrix.renderer }} ${{ matrix.viewport }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-${{ matrix.renderer }}-${{ matrix.viewport }}
          path: test-results/landing
