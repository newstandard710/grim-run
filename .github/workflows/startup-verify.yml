name: Verify immediate Start on the reviewed game
on:
  push:
    branches: [qa/immediate-start-verification]
permissions:
  contents: read
env:
  CANDIDATE: a94b580e77493ec592672b9c99c613e884ea59d8
  PRIOR: 4cd13aea011607f0376817128506454a617fa393
  LIVE: 2e5d0ed75546939b632df373d9cb0bd5d0a66eb9
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        treatment: [startup, landing-canvas, landing-webgl, lifecycle, portrait]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE }}
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.treatment == 'startup' && env.PRIOR || env.LIVE }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - env:
          TREATMENT: ${{ matrix.treatment }}
        run: |
          export LANDING_CANDIDATE=candidate LANDING_BASELINE=baseline
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          case "$TREATMENT" in
            startup)
              test "$(git -C baseline rev-parse HEAD)" = "$PRIOR"
              CASE=paired node tests/startup-profile.js ;;
            landing-*) TRIAL_RENDERER="${TREATMENT#landing-}" node tests/forest-hitch-loader-trial.js ;;
            lifecycle) node tests/landing-lifecycle-audit.js ;;
            portrait) node tests/portrait-audit.js ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-start-${{ matrix.treatment }}
          path: test-results
