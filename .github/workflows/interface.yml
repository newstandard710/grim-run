name: Grim Run Interface
on:
  push:
    branches: [main, feature/veil-and-reliquary]
    paths:
      - index.html
      - assets/ui/**
      - tests/beyond-death.cjs
      - tests/browser-beyond-death.js
      - .github/workflows/interface.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  interface-and-input:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify upgrade, vendor, resurrection and speed rules
        run: node tests/beyond-death.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify four screen sizes, two thumbs, finger swipes and resurrection scenes
        run: node tests/browser-beyond-death.js
      - name: Save interface review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grim-run-interface-renders
          path: test-results/beyond-*
          if-no-files-found: ignore
