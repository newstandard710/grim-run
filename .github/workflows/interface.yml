name: Grim Run Interface
on:
  push:
    branches: [main, feature/veil-and-reliquary]
    paths:
      - index.html
      - assets/ui/**
      - assets/campaign/**
      - tests/browser-forest-campaign.js
      - tests/browser-reliquary-loadout.js
      - tests/beyond-death.cjs
      - tests/browser-beyond-death.js
      - tests/browser-obstacle-smoke.js
      - tests/browser-air-combos.js
      - tests/browser-ground-fog-vendors.js
      - .github/workflows/interface.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  interface-and-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify upgrade, vendor, resurrection and speed rules
        run: node tests/beyond-death.cjs
      - name: Select changed interface checks
        id: scope
        run: |
          if [ '${{ github.ref }}' = refs/heads/main ] || [ '${{ github.event_name }}' != push ] || ! git diff --quiet HEAD^ HEAD -- index.html assets/ui tests/beyond-death.cjs tests/browser-beyond-death.js; then
            echo 'interface=true' >> "$GITHUB_OUTPUT"
          else
            echo 'interface=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Verify four screen sizes, two thumbs, finger swipes and resurrection scenes
        if: steps.scope.outputs.interface == 'true'
        run: node tests/browser-beyond-death.js
      - name: Verify hosted startup retry, Home and Reliquary focus, and combined controls
        if: steps.scope.outputs.interface == 'true'
        run: |
          node tests/browser-home-startup-input.js
          GRIM_HOME_CANVAS=1 node tests/browser-home-startup-input.js
      - name: Verify remaining obstacle, combo and fog regressions on the release branch
        if: github.ref == 'refs/heads/feature/veil-and-reliquary'
        run: |
          node tests/browser-obstacle-smoke.js
          node tests/browser-air-combos.js
          node tests/browser-ground-fog-vendors.js
      - name: Save interface review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grim-run-interface-renders
          path: test-results/beyond-*
          if-no-files-found: ignore

  forest-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify Forest Campaign, guardian, revival and exact resume
        run: node tests/browser-forest-campaign.js
      - name: Verify Foothills unlock, touch pursuit, rewards and interrupted attempts
        run: node tests/browser-forest-campaign.js --foothills
      - name: Verify Tundra touch clears, ranged combat, revival and interrupted rewards
        run: node tests/browser-forest-campaign.js --tundra
