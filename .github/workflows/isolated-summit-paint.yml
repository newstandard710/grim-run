name: Public v0.19.21 Tundra and damage smoke
on:
  push:
    branches: [audit-summit-paint-diagnostic]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Play the deployed game and check the summit texture
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node tests/isolated-summit-paint.js
