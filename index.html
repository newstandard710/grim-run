.chest-beam{position:absolute;bottom:12%;left:35%;width:30%;height:68%;background:linear-gradient(0deg,#8cebe75e,transparent);filter:blur(9px);animation:beamPulse 1.4s infinite alternate;}
.chest-base{position:absolute;bottom:7%;left:60%;width:34%;height:34%;border:3px solid #d5a66b;border-radius:10px;background:linear-gradient(#6c534c,#292e3b);box-shadow:0 7px 15px #0008;}
.chest-lid{position:absolute;left:-5%;right:-5%;top:-11%;height:36%;border:4px solid #d6bc8c;border-radius:9px;background:#554640;transform-origin:bottom center;animation:openLid 4.4s ease forwards;}
.chest-lock{position:absolute;left:40%;top:25%;color:#ffe5a5;font-size:clamp(18px,5vh,33px);}
.chest-crossbow{position:absolute;width:35%;height:68%;left:58%;top:12%;filter:drop-shadow(0 0 17px #8cebe7);animation:liftRelic 4.4s ease forwards;}
.chest-reaper{position:absolute;left:13%;bottom:3%;width:36%;height:70%;filter:drop-shadow(0 4px 7px #000);animation:reaperReveal 4.4s ease-out forwards;}
.chest-rune{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:clamp(20px,7vh,42px);color:#a6ffea;animation:beamPulse 1.2s infinite alternate;}
.chest-title{font-size:clamp(16px,4.4vh,35px);font-weight:1000;letter-spacing:.12em;text-shadow:0 0 21px #8cebe794;}
.chest-caption{font-size:clamp(9px,2vh,14px);font-weight:850;letter-spacing:.15em;margin:4px;color:#a4d3d2;}
#chest-continue-btn{min-height:32px;padding:5px 20px;margin:5px auto 0;}
@keyframes openLid{0%,15%{transform:rotate(0)}35%,100%{transform:rotate(-69deg)}}
@keyframes liftRelic{0%,19%{transform:translateY(40%) scale(.45);opacity:0}35%{opacity:1}72%,100%{transform:translate(-115%,-32%) scale(1.08);opacity:1}}
@keyframes reaperReveal{0%,15%{opacity:0;transform:translateY(12px)}35%,100%{opacity:1;transform:translateY(0)}}
@keyframes beamPulse{from{opacity:.42}to{opacity:1}}
@media(max-height:330px){.chest-illustration{height:104px}.chest-eyebrow{font-size:9px}.chest-title{font-size:16px}.chest-caption{font-size:9px}}

          const reach=86*(1+this.powerManager.attackBonus());
          const a=-1.15+progress*1.5;
          const tipX=x+25+Math.cos(a)*reach;
          const tipY=feet-16+Math.sin(a)*28;
          g.lineStyle(6,0x9b8069);g.lineBetween(x+8,feet-20,tipX,tipY);
          g.lineStyle(5,0xd9efea);g.lineBetween(tipX,tipY,tipX+22,tipY-24);
          if(Core.attackActive(p.attackMs,C.attackDurationMs,C.attackActiveStart,C.attackActiveEnd)){
            g.lineStyle(4,0x9ffaf1,.75);g.beginPath();g.arc(x+20,feet-18,reach,5.25,6.2);g.strokePath();
          }
        }
        if(p.slowMs>0){
          g.lineStyle(2,0xa8e9ff,.7);g.strokeEllipse(x-8,feet-17,101,39);
          g.fillStyle(0x8de7ff,.1);g.fillEllipse(x-18,feet-18,85,35);
        }
      }else{
        const jump=!this.onGround;
        if(jump && this.powerManager.level('skeletalWings')>0){
          g.lineStyle(4,0xf3e0c1,p.hovering?.97:.65);
          const spread=p.hovering?13:4;
          for(let side of [-1,1]){
            const base=x+side*12;
            g.lineBetween(base,y-63,x+side*(39+spread),y-96);
            g.lineBetween(x+side*(39+spread),y-96,x+side*(69+spread),y-72);
            g.lineBetween(base,y-63,x+side*(55+spread),y-45);
            g.lineBetween(x+side*(55+spread),y-45,x+side*(73+spread),y-28);
          }
        }
        if(jump && this.powerManager.level('ravenWings')>0){
          // Spectral raven feathers appear on both aerial jumps after unlocking the power.
          const wingBeat=Math.sin(this.elapsed*19)*7;
          g.fillStyle(0x826cbb,.67);
          g.fillPoints([{x:x-14,y:y-61},{x:x-45,y:y-75-wingBeat},{x:x-63,y:y-109-wingBeat},
            {x:x-32,y:y-93-wingBeat*.6},{x:x-26,y:y-70}],true);
          g.fillStyle(0xb7aaff,.46);
          g.fillPoints([{x:x-16,y:y-60},{x:x-35,y:y-72-wingBeat},{x:x-46,y:y-94-wingBeat},
            {x:x-23,y:y-79}],true);
        }
        const swing=Core.attackActive(p.attackMs,C.attackDurationMs,C.attackActiveStart,C.attackActiveEnd);
        // Animated legs include knees, shin flex and alternating feet.
        for(let leg=0;leg<2;leg++){
          const phase=cycle+leg*Math.PI;
          const stride=jump?(leg?10:-12):Math.sin(phase)*13;
          const kneeY=jump?y-22:y-18+Math.max(0,Math.cos(phase))*5;
          const kneeX=x+(leg?2:-6)+stride*.57;
          const footX=jump?kneeX+(leg?-6:14):x+stride*1.35+(leg?5:-2);
          const footY=jump?y-8+(leg?6:-11):y-Math.max(0,Math.cos(phase))*7;
          g.lineStyle(7,leg?0x121a2c:0x172034);
          g.lineBetween(x+(leg?6:-8),y-28,kneeX,kneeY);
          g.lineStyle(6,0x192133);g.lineBetween(kneeX,kneeY,footX,footY);
          g.lineStyle(5,0x263347);g.lineBetween(footX-4,footY,footX+7,footY);
        }
        const flutter=running?Math.sin(cycle)*4:2*Math.sin(this.elapsed*5);
        // Three layered fabric tails, trailing from the shoulders.
        g.fillStyle(0x101727);
        g.fillPoints([{x:x-18,y:y-54},{x:x+10,y:y-54},{x:x+21,y:y-13},
          {x:x+3,y:y-6+flutter*.4},{x:x-13,y:y-14},{x:x-31-flutter,y:y-7}],true);
        g.fillStyle(0x2a3145);
        g.fillPoints([{x:x-20,y:y-56},{x:x+7,y:y-58},{x:x+18,y:y-25},
          {x:x+14,y:y-13},{x:x-2,y:y-22},{x:x-24-flutter,y:y-8},{x:x-15,y:y-34}],true);
        g.fillStyle(robe);
        g.fillPoints([{x:x-16,y:y-61},{x:x+15,y:y-57},{x:x+14,y:y-28},
          {x:x+24,y:y-13},{x:x+3,y:y-17},{x:x-20-flutter*.6,y:y-11}],true);
        g.lineStyle(2,trim,.48);g.lineBetween(x-12,y-52,x-13-flutter*.2,y-17);
        // Hood, outer cowl, skeletal mask and eerie eyes.
        g.fillStyle(0x0c1424);g.fillEllipse(x-3,y-67,41,45);
        g.fillStyle(0x343f55);g.fillEllipse(x-8,y-81,37,12);
        g.fillStyle(0x242d42);g.fillTriangle(x-25,y-81,x-11,y-95,x+14,y-80);
        g.fillStyle(0x060d19);g.fillEllipse(x+6,y-66,28,30);
        g.fillStyle(0xa1aaa9,.92);g.fillEllipse(x+10,y-57,13,12);
        g.fillStyle(0x0a1520);g.fillEllipse(x+15,y-54,6,4);
        g.fillStyle(CYAN);g.fillEllipse(x+5,y-68,6,3.6);g.fillEllipse(x+16,y-69,6,3.6);
        g.fillStyle(0xe1fff6,.9);g.fillCircle(x+15,y-69,1);
        // Back arm swings opposite the stride.
        g.lineStyle(6,0x202a3d);g.lineBetween(x-11,y-47,x-19+(jump?-4:Math.sin(cycle)*6),y-33);
        const gripX=x+14,gripY=y-43;
        if(p.attackMs>0){
          const progress=1-p.attackMs/C.attackDurationMs;
          const angle=-2.6+progress*2.5;
          const reach=85*(1+this.powerManager.attackBonus());
          const endX=gripX+Math.cos(angle)*reach,endY=gripY+Math.sin(angle)*reach;
          const bladeAngle=angle+1.1;
          const tipX=endX+Math.cos(bladeAngle)*42,tipY=endY+Math.sin(bladeAngle)*42;
          g.lineStyle(6,0x2e364b);g.lineBetween(x+7,y-51,gripX,gripY);
          g.lineStyle(6,0x8d7060);g.lineBetween(gripX,gripY,endX,endY);
          g.lineStyle(2,0xc5b79c,.9);g.lineBetween(gripX+2,gripY-3,endX-2,endY-2);
          g.lineStyle(6,0x9caeaf);g.lineBetween(endX,endY,tipX,tipY);
          g.lineStyle(4,0xe4f6ed);g.beginPath();g.moveTo(endX-5,endY+3);
          g.lineTo(tipX+Math.cos(bladeAngle+.36)*11,tipY+Math.sin(bladeAngle+.36)*11);
          g.lineTo(tipX,tipY);g.strokePath();
          if(swing){
            const arcRadius=106*(1+this.powerManager.attackBonus());
            g.lineStyle(8,0x66e6da,.15);g.beginPath();g.arc(x+9,y-45,arcRadius,4.25,6.2);g.strokePath();
            g.lineStyle(3,0xbef9ef,.8);g.beginPath();g.arc(x+9,y-45,arcRadius-2,4.38,6.13);g.strokePath();
          }
        }else{
          // Resting scythe is clearly behind / above the shoulder, not held out as an attack.
          const baseX=x-8,baseY=y-31,endX=x+30,endY=y-115;
          g.lineStyle(5,0x927968);g.lineBetween(baseX,baseY,endX,endY);
          g.lineStyle(2,0xb7a28d,.7);g.lineBetween(baseX+2,baseY-3,endX+1,endY);
          g.fillStyle(0x899ea1);g.fillPoints([
            {x:endX-3,y:endY+6},{x:endX+10,y:endY-3},
            {x:endX+38,y:endY-2},{x:endX+45,y:endY+14},{x:endX+22,y:endY+3}],true);
          g.lineStyle(2,0xe7f7ed);g.lineBetween(endX+38,endY-1,endX+44,endY+14);
          g.lineStyle(5,0x283247);g.lineBetween(x+6,y-50,x+19,y-43);
        }
      }
      g.setAlpha(1);
      if(this.gunUnlocked){
        // Bone-and-sinew crossbow: ivory curved limbs, pale bowstring, carved stock.
        const cx=x+26,cy=feet-53;
        g.lineStyle(5,0xe1dbc9,.98);
        g.beginPath();g.moveTo(cx-8,cy-18);g.lineTo(cx+2,cy-7);g.lineTo(cx+14,cy-18);g.strokePath();
        g.lineStyle(2,0x91f1df,.9);g.lineBetween(cx-8,cy-18,cx+14,cy-18);
        g.lineStyle(7,0xd4bea0,.96);g.lineBetween(cx+3,cy-24,cx+13,cy+13);
        g.lineStyle(3,0x535e6a,.96);g.lineBetween(cx+3,cy-20,cx+12,cy+9);
        g.fillStyle(0x98ffe6,.9);g.fillTriangle(cx-1,cy-22,cx+6,cy-30,cx+8,cy-19);
      }
      if(!p.grounded&&this.powerManager.level('skeletalWings')>0){
        const total=this.powerManager.skeletalHoverMs();
        const ratio=Math.max(0,Math.min(1,p.hoverBudgetMs/total));
        g.fillStyle(0x0d1424,.78);g.fillRoundedRect(x-32,feet-153,64,7,3);
        if(ratio>0){g.fillStyle(0xd5e2e0,.93);g.fillRoundedRect(x-30,feet-151,60*ratio,3,1.5);}
      }
    }
    drawForeground() {
      const g=this.foreground;g.clear();
      // Edge fog gives atmosphere without obscuring central hazards.
      g.fillStyle(0x6f9e9c,.025);g.fillRect(0,this.groundY-20,this.width,55);
      g.fillStyle(0x030716,.22);g.fillRect(0,this.height-9,this.width,9);
      if(this.state==='playing' && this.player.slowMs>0){
        g.fillStyle(0x75dfff,.055);g.fillRect(0,0,this.width,this.height);
      }
      if(this.fallFeedbackMs>0){
        g.fillStyle(0xef4969,.085*(this.fallFeedbackMs/1550));g.fillRect(0,0,this.width,this.height);
      }
      if(this.state==='playing' && this.player.hp<=2){
        const low=this.player.hp===1?.30:.12;
        const pulse=this.player.hp===1?(.94+.06*Math.sin(this.elapsed*4)):1;
        const alpha=low*pulse;
        const w=this.width,h=this.height;
        g.fillStyle(0xbf1727,alpha);
        for(let j=0;j<5;j++){
          const a=alpha*(1-j/5);
          g.fillStyle(0xbf1727,a);
          const thickness=8;
          g.fillRect(j*thickness,0,thickness,h);
          g.fillRect(w-(j+1)*thickness,0,thickness,h);
          g.fillRect(0,j*thickness,w,thickness);
          g.fillRect(0,h-(j+1)*thickness,w,thickness);
        }
      }
      if(this.blastFlashMs>0){
        g.fillStyle(0xf6d78b,.19*(this.blastFlashMs/420));
        g.fillRect(0,0,this.width,this.height);
      }
      if(this.damageFlashMs>0){
        const a=.27*Math.pow(this.damageFlashMs/420,1.8);
        g.fillStyle(0xff202c,a);g.fillRect(0,0,this.width,this.height);
      }
      if(this.state==='playing' && this.player.invulMs>0) {
        g.fillStyle(0xff5252,.045);g.fillRect(0,0,this.width,this.height);
      }
    }
  }
  scope.GrimGameScene = GameScene;
})(window);

</script>
